version: '3.8'

services:
  rag-web:
    build: .
    container_name: global_rag_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./chroma_db_global:/app/chroma_db_global
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3