[project]
name = "rags-project"
version = "0.1.0"
description = "Seven RAG pipelines (Hybrid, Corrective Hybrid, Basic, Parent-Child, Corrective Parent-Child, Ext Naive, Ext Corrective) over PDF documents, with a Streamlit UI, unified ChromaDB file management, and cost tracking"
readme = "README.md"
authors = [
    { name = "Aya Hamed", email = "aya.hamed.salem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb",
    "langchain-text-splitters>=1.1.3",
    "numpy",
    "openai>=3.51.0",
    "pdf2image",
    "pillow",
    "pypdf>=7.1.0",
    "pytesseract",
    "python-docx",
    "python-dotenv",
    "rank-bm25>=0.2.2",
    "requests",
    "streamlit>=1.67.0",
]
